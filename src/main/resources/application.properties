# Application
spring.application.name=IA
server.port=${SERVER_PORT:8080}

# Database - MySQL
spring.datasource.url=${DB_HOST_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.pool-name=IAHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.max-tokens=2048
spring.ai.openai.chat.max-completion-tokens=2048
spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=2

# Anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-4-5-20250929
spring.ai.anthropic.chat.temperature=0.7
spring.ai.anthropic.chat.max-tokens=4096
spring.ai.anthropic.timeout=60s
spring.ai.anthropic.max-retries=2

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=gemma4:e2b
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.chat.num-predict=2048
spring.ai.ollama.chat.keep-alive=10m
spring.ai.ollama.init.pull-model-strategy=never

# Logging
logging.level.root=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=WARN
